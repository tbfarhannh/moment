<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerita Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { plum:'#2a0f1e', wine:'#4a1830', rose:'#e8758a', blush:'#f7d6dc', gold:'#dcbb8c' },
    fontFamily: { serif:['"Cormorant Garamond"','Georgia','serif'], sans:['Jost','system-ui','sans-serif'] }
  } }
}
</script>
<style>
  html { scroll-behavior:smooth; }
  body { background:#2a0f1e; }
  .bg-glow { background:
    radial-gradient(60% 40% at 50% 0%, rgba(232,117,138,.28), transparent 70%),
    radial-gradient(50% 35% at 100% 60%, rgba(220,187,140,.12), transparent 70%),
    #2a0f1e; }
  .polaroid { background:#fdf3ee; padding:.7rem .7rem 0; box-shadow:0 18px 40px -18px rgba(0,0,0,.7); transition:transform .35s ease; }
  .polaroid:hover, .polaroid:focus-visible { transform:rotate(0) scale(1.02) !important; z-index:5; }
  .polaroid .ph { aspect-ratio:4/5; background:linear-gradient(135deg,#6b2543,#e8758a); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .polaroid img { width:100%; height:100%; object-fit:cover; display:block; }
  .reveal { opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity:1; transform:none; }
  .float-heart { position:fixed; bottom:-40px; pointer-events:none; color:#e8758a; opacity:0; animation:rise linear forwards; z-index:1; }
  @keyframes rise { 0%{transform:translateY(0) translateX(0) scale(.6);opacity:0} 10%{opacity:.7} 100%{transform:translateY(-110vh) translateX(var(--dx)) scale(1.2);opacity:0} }
  .beat { animation:beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  @media (prefers-reduced-motion:reduce){ .reveal{opacity:1;transform:none;transition:none} .beat,.float-heart{animation:none} html{scroll-behavior:auto} }
  :focus-visible { outline:2px solid #dcbb8c; outline-offset:3px; }
</style>
</head>
<body class="bg-glow text-blush font-sans antialiased min-h-screen">

<!-- HERO -->
<header class="relative min-h-screen flex flex-col items-center justify-center text-center px-6 overflow-hidden">
  <svg class="beat w-14 h-14 text-rose mb-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.6 0 5.7 3.7 4.2 7.2C19.500 16.400 12 21 12 21z"/></svg>
  <h1 id="names" class="font-serif italic font-semibold text-5xl sm:text-7xl md:text-8xl leading-tight"></h1>
  <p class="font-serif text-xl sm:text-2xl text-gold mt-6 max-w-xl">Kumpulan momen kecil yang pelan-pelan jadi cerita paling kusuka.</p>
  <div class="mt-12 grid grid-cols-4 gap-3 sm:gap-6 max-w-md w-full" aria-label="Lama kebersamaan">
    <div><div id="cd-d" class="font-serif text-4xl sm:text-5xl">0</div><div class="text-xs sm:text-sm text-blush/70">hari</div></div>
    <div><div id="cd-h" class="font-serif text-4xl sm:text-5xl">0</div><div class="text-xs sm:text-sm text-blush/70">jam</div></div>
    <div><div id="cd-m" class="font-serif text-4xl sm:text-5xl">0</div><div class="text-xs sm:text-sm text-blush/70">menit</div></div>
    <div><div id="cd-s" class="font-serif text-4xl sm:text-5xl">0</div><div class="text-xs sm:text-sm text-blush/70">detik</div></div>
  </div>
  <a href="#galeri" class="mt-14 inline-flex items-center gap-2 rounded-full border border-gold/60 px-7 py-3 text-gold hover:bg-gold hover:text-plum transition">Lihat momen kita</a>
</header>

<!-- GALERI -->
<main id="galeri" class="relative z-10 max-w-6xl mx-auto px-5 py-24">
  <h2 class="reveal font-serif italic text-4xl sm:text-5xl text-center">Potongan hari-hari kita</h2>
  <p class="reveal text-center text-blush/70 mt-4 mb-16">Ketuk foto untuk memperbesar.</p>
  <div id="grid" class="columns-1 sm:columns-2 lg:columns-3 gap-8"></div>
</main>

<!-- PENUTUP -->
<section id="penutup" class="relative z-10 px-6 pt-10 pb-28 text-center">
  <div class="relative max-w-xl mx-auto">
    <canvas id="heart" class="w-full h-[320px] sm:h-[400px] cursor-pointer" aria-label="Animasi hati. Ketuk untuk menebar cinta."></canvas>
    <p class="text-xs text-blush/60 -mt-2">Ketuk layar untuk menebar cinta</p>
  </div>
  <div class="reveal max-w-2xl mx-auto mt-14">
    <h2 class="font-serif italic text-4xl sm:text-5xl">Terima kasih sudah tinggal</h2>
    <div id="closing" class="font-serif text-xl sm:text-2xl leading-relaxed mt-8 space-y-5 text-blush/90"></div>
    <p id="sign" class="font-serif italic text-3xl text-rose mt-10"></p>
  </div>
</section>

<!-- LIGHTBOX -->
<div id="lb" class="fixed inset-0 z-50 hidden bg-black/90 items-center justify-center p-4" role="dialog" aria-modal="true">
  <button id="lb-x" class="absolute top-4 right-5 text-3xl text-blush" aria-label="Tutup">&times;</button>
  <button id="lb-p" class="absolute left-2 sm:left-6 text-4xl text-blush p-3" aria-label="Sebelumnya">&#8249;</button>
  <figure class="max-w-3xl w-full text-center">
    <img id="lb-i" class="max-h-[78vh] mx-auto rounded-sm object-contain" alt="">
    <figcaption id="lb-c" class="font-serif text-xl mt-4"></figcaption>
  </figure>
  <button id="lb-n" class="absolute right-2 sm:right-6 text-4xl text-blush p-3" aria-label="Berikutnya">&#8250;</button>
</div>

<script>
/* ============ EDIT BAGIAN INI ============ */
const CONFIG = {
  names: 'Dia & Aku',                       // contoh: 'Rina & Dimas'
  startDate: '2023-02-14T00:00:00',          // tanggal jadian
  signature: 'Selamanya milikmu, Aku',
  closing: [
    'Terima kasih sudah jadi rumah di hari-hari yang melelahkan dan alasan tersenyum di hari-hari yang biasa saja.',
    'Aku tidak tahu apa yang menunggu di depan, tapi aku tahu aku ingin melewatinya bersamamu.',
    'Semoga foto-foto ini terus bertambah, sampai kita tua dan lupa menghitungnya.'
  ]
};
// Taruh foto di folder "foto/" dengan nama 1.jpg ... 20.jpg, lalu ubah caption di bawah.
const PHOTOS = [
  ['Awal kita bertemu','Februari 2023'],['Senyum pertama yang kuingat','Maret 2023'],
  ['Jalan-jalan tanpa tujuan','April 2023'],['Makan malam favorit kita','Mei 2023'],
  ['Hujan, payung, dan kamu','Juni 2023'],['Liburan pertama berdua','Juli 2023'],
  ['Hari ulang tahunmu','Agustus 2023'],['Sunset yang kita kejar','September 2023'],
  ['Kopi dan obrolan panjang','Oktober 2023'],['Nonton film bareng','November 2023'],
  ['Natal yang hangat','Desember 2023'],['Tahun baru bersamamu','Januari 2024'],
  ['Kejutan kecil darimu','Februari 2024'],['Setahun bersama','Februari 2024'],
  ['Hari paling random','Mei 2024'],['Masak bareng (gagal tapi lucu)','Juli 2024'],
  ['Pantai dan angin sore','Agustus 2024'],['Saat kamu tertawa lepas','Oktober 2024'],
  ['Kita yang makin kompak','Desember 2024'],['Dan masih banyak lagi...','Hari ini']
].map(([cap,date],i)=>({ src:`foto/${i+1}.jpg`, cap, date }));
/* ========================================= */

const $ = id => document.getElementById(id);
const heartPath = 'M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.5 1 5.400 3 1.900-2 3.400-3 5.400-3 3.600 0 5.700 3.700 4.200 7.200C19.500 16.400 12 21 12 21z';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('names').textContent = CONFIG.names;
$('sign').textContent = CONFIG.signature;
$('closing').innerHTML = CONFIG.closing.map(t=>`<p>${t}</p>`).join('');
document.title = 'Cerita ' + CONFIG.names;

/* Hitung mundur lama bersama */
const start = new Date(CONFIG.startDate).getTime();
function tick(){
  let s = Math.max(0, Math.floor((Date.now()-start)/1000));
  $('cd-d').textContent = Math.floor(s/86400);
  $('cd-h').textContent = Math.floor(s%86400/3600);
  $('cd-m').textContent = Math.floor(s%3600/60);
  $('cd-s').textContent = s%60;
}
tick(); setInterval(tick,1000);

/* Galeri polaroid */
const tilts = [-3,2,-1.5,3,-2,1.5];
$('grid').innerHTML = PHOTOS.map((p,i)=>`
  <button class="polaroid reveal block w-full mb-8 text-left break-inside-avoid" style="transform:rotate(${tilts[i%6]}deg)" data-i="${i}" aria-label="Perbesar: ${p.cap}">
    <div class="ph"><img src="${p.src}" alt="${p.cap}" loading="lazy" onerror="this.remove();this.parentNode&&0"></div>
    <div class="py-3 px-1">
      <div class="font-serif italic text-xl text-wine leading-snug">${p.cap}</div>
      <div class="text-xs text-wine/60 mt-0.5">${p.date}</div>
    </div>
  </button>`).join('');

/* Reveal saat scroll */
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* Lightbox */
let cur = 0;
function show(i){
  cur = (i+PHOTOS.length)%PHOTOS.length;
  const p = PHOTOS[cur];
  $('lb-i').src = p.src; $('lb-i').alt = p.cap;
  $('lb-c').textContent = p.cap + ' · ' + p.date;
  $('lb').classList.remove('hidden'); $('lb').classList.add('flex');
}
function hide(){ $('lb').classList.add('hidden'); $('lb').classList.remove('flex'); }
$('grid').addEventListener('click',e=>{ const b=e.target.closest('.polaroid'); if(b) show(+b.dataset.i); });
$('lb-x').onclick = hide; $('lb-p').onclick = ()=>show(cur-1); $('lb-n').onclick = ()=>show(cur+1);
$('lb').addEventListener('click',e=>{ if(e.target===$('lb')) hide(); });
addEventListener('keydown',e=>{
  if($('lb').classList.contains('hidden')) return;
  if(e.key==='Escape') hide(); if(e.key==='ArrowLeft') show(cur-1); if(e.key==='ArrowRight') show(cur+1);
});

/* Hati melayang di latar */
function floatHeart(){
  const el = document.createElement('div');
  el.className = 'float-heart';
  const size = 10 + Math.random()*22;
  el.style.left = Math.random()*100 + 'vw';
  el.style.width = el.style.height = size + 'px';
  el.style.setProperty('--dx', (Math.random()*120-60)+'px');
  el.style.animationDuration = (9 + Math.random()*8) + 's';
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${heartPath}"/></svg>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 18000);
}
if(!reduce) setInterval(floatHeart, 1100);

/* Animasi hati di kanvas: partikel membentuk hati + ledakan saat diketuk */
const cv = $('heart'), ctx = cv.getContext('2d');
let W, H, dpr, parts = [], bursts = [];
function resize(){
  dpr = devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function heartPt(t){
  return [16*Math.pow(Math.sin(t),3),
          -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
}
function build(){
  parts = [];
  for(let i=0;i<520;i++){
    const t = Math.random()*Math.PI*2, [x,y] = heartPt(t);
    const f = Math.pow(Math.random(),.6);            // isi + tepi
    parts.push({ x, y, f, o: Math.random()*6.28, s: .6+Math.random()*1.6, hue: 340+Math.random()*25 });
  }
}
function burst(cx,cy){
  for(let i=0;i<26;i++){
    const a = Math.random()*6.28, v = 1.5+Math.random()*4;
    bursts.push({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, life:1, size:6+Math.random()*12 });
  }
}
function drawMini(x,y,s,alpha){
  ctx.save(); ctx.translate(x,y); ctx.scale(s/24,s/24); ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff8fa3'; ctx.shadowColor = '#e8758a'; ctx.shadowBlur = 12;
  ctx.fill(new Path2D(heartPath)); ctx.restore();
}
function frame(now){
  const t = now/1000;
  ctx.clearRect(0,0,W,H);
  const beat = reduce ? 1 : 1 + .06*Math.pow(Math.sin(t*3.2),8)*1.5 + .02*Math.sin(t*1.6);
  const sc = Math.min(W,H)/38*beat, cx = W/2, cy = H/2 + sc*.6;
  ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    const w = reduce ? 0 : Math.sin(t*1.5+p.o)*.5;
    const x = cx + (p.x*p.f + w*.4)*sc, y = cy + (p.y*p.f + w*.4)*sc;
    ctx.fillStyle = `hsla(${p.hue},85%,${60+p.f*14}%,${.35+.4*p.f})`;
    ctx.beginPath(); ctx.arc(x,y,p.s,0,6.28); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.x += b.vx; b.y += b.vy; b.vy += .09; b.life -= .012;
    if(b.life<=0){ bursts.splice(i,1); continue; }
    drawMini(b.x-b.size/2, b.y-b.size/2, b.size, b.life);
  }
  requestAnimationFrame(frame);
}
function pointer(e){
  const r = cv.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
  burst(pt.clientX - r.left, pt.clientY - r.top);
}
cv.addEventListener('pointerdown', pointer);
addEventListener('resize', resize);
resize(); build();
setTimeout(()=>burst(W/2,H/2), 600);
requestAnimationFrame(frame);
</script>
</body>
</html>
